id=coordinate-direction-reflection
prompt=After moving an immutable Coordinate, which value should describe the new position?
options=returned-coordinate,mutated-original
correctOptionId=returned-coordinate
option.returned-coordinate.text=The coordinate returned by move.
option.returned-coordinate.feedback=Correct: a transition returns a new value while the original record remains unchanged.
option.mutated-original.text=The original coordinate, changed in place.
option.mutated-original.feedback=Record components describe the original value. Use the returned coordinate for the next position.
