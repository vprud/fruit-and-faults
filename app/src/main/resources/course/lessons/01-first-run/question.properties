id=first-run-reflection
prompt=Why can a compilation failure prevent a test result from appearing?
options=compile-before-tests,assertion-first
correctOptionId=compile-before-tests
option.compile-before-tests.text=The source must compile before tests can execute.
option.compile-before-tests.feedback=Correct: resolve compilation diagnostics first, then inspect any test failures.
option.assertion-first.text=An assertion always runs before compilation.
option.assertion-first.feedback=An assertion executes compiled code. Revisit the check category and repair the compilation error first.
